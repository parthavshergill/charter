# The checks every pull request and every push to main must pass, then the deploy to the preview. The checks
# have no secret: no API key and no Cloudflare token. A pull request runs with a read-only token, because a
# build runs its Lean code. Only the deploy job has a secret, and the `preview` environment gives it to main alone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A deploy on main is never cut off by the next push. It finishes, and the next one follows.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Lean
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      # The same elan as the Dockerfile.
      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"

      - name: Restore the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake
            forks/leansqlite/.lake
            packages/*/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # This proves each game valid, and it stops if a pack's look has gaps.
      - name: Build everything
        run: lake build

      - name: Check the proofs
        run: make audit

      - name: Play full games over HTTP
        run: make smoke

      - name: Check the clerk and the Claude seats, against a stand-in
        run: make clerk-check

      - name: Check budgets, pausing and storage, against stand-ins
        run: make deploy-check

  deploy-preview:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Deploy to the preview
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy --env preview

      # A new container can take a few minutes to replace the old one, so this only checks that the game answers.
      - name: Check that the preview answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 30 https://charter-preview.parthavshergill.workers.dev/api/defs | python3 -c "import json,sys; assert len(json.load(sys.stdin)) > 0"; then
              echo "the preview answers"
              exit 0
            fi
            sleep 10
          done
          echo "the preview did not answer"
          exit 1
