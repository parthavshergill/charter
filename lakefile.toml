name = "charter"
defaultTargets = ["Charter", "charter-server", "charter-sim", "ServerTests"]

[[require]]
name = "hexgrid"
path = "packages/lean-hexgrid"

[[require]]
name = "lobby"
path = "packages/lean-lobby"

[[require]]
name = "eventlog"
path = "packages/lean-eventlog"

[[require]]
name = "GpuCmd"
path = "packages/lean-gpu-cmd"

[[lean_lib]]
name = "Charter"

[[lean_lib]]
name = "Comparator"
roots = ["Comparator.Challenge", "Comparator.Solution"]

[[lean_lib]]
name = "Server"

[[lean_lib]]
name = "ServerTests"

[[lean_exe]]
name = "charter-server"
root = "Server.Main"

[[lean_exe]]
name = "charter-sim"
root = "Server.Sim"

[[lean_exe]]
name = "charter-measure"
root = "Server.Measure"

[[lean_exe]]
name = "charter-contact"
root = "Server.ContactSheet"

[[lean_lib]]
name = "Evolved"

[[lean_exe]]
name = "charter-arena"
root = "Server.Arena"

# The training environment. It is not a default target, and the server does not import it. See rl/README.md.
[[lean_lib]]
name = "CharterRL"
srcDir = "rl/lean"

[[lean_exe]]
name = "charter-rl-check"
srcDir = "rl/lean"
root = "CharterRL.CheckMain"

[[lean_exe]]
name = "charter-rl-shared"
srcDir = "rl/lean"
root = "CharterRL.Capi"
moreLinkArgs = ["-shared", "rl/build/capi.o"]
