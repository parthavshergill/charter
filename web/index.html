<script>
// Every file below comes from this one version's folder, which the server names when it sends this page, so
// old and new files cannot mix. If a deploy has replaced the version since, a new page has all of it.
function reloadOnce() { try { if (sessionStorage.getItem("charter.reloaded")) return; sessionStorage.setItem("charter.reloaded", "1"); } catch { return; } location.reload(); }
const atTable = new URLSearchParams(location.search).has("game");
// The title page only: its wordmark and tagline must not change font while the sheet opens.
if (!atTable)
  for (const f of ["grenze-gotisch-700-charter", "im-fell-english-italic"])
    document.head.append(Object.assign(document.createElement("link"), { rel: "preload", href: `fonts/${f}.woff2`, as: "font", type: "font/woff2", crossOrigin: "" }));
// A table needs the 3D player at once. The title page asks for it after the form can be used.
else for (const f of ["vendor/player.js", "vendor/meshfile.js", "vendor/vendor/three.module.min.js"])
  document.head.append(Object.assign(document.createElement("link"), { rel: "modulepreload", href: f }));
</script>
