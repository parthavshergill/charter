   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #8a8984" transform="translate(80.64 587.11125)">* Evolved by program synthesis [read: Claude keeps rewriting the bot and we keep whatever wins].</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #8a8984" transform="translate(80.64 606.31125)">Bot games: 800 per point on Island and Not Catan, with 95% intervals.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #8a8984" transform="translate(80.64 625.51125)">Sonnet: 0 games on Island, our bot in every seat in turn. Sonnet gets only our bot's moves (no laws, talk or player trades). Small samples, so wide bars.</text>
