  <g id="text_20">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="80.64" y="87.48" transform="rotate(-0 80.64 87.48)">Charter, 4 players. Warm-started by copying our rule-based bot, then trained against itself and an evolved rival*.</text>
