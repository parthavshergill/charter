  <g id="text_19">
   <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="80.64" y="51.84" transform="rotate(-0 80.64 51.84)">Trained with PPO, our bot now beats the rule-based bot it copied</text>
